services:
  - type: web
    name: taskpulse
    runtime: node
    plan: free
    buildCommand: npm install && npm run setup:backend:deploy && npm run setup:frontend && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: admin
      # DATABASE_URL — создай PostgreSQL в Render и добавь сюда URL (Environment в настройках сервиса)
